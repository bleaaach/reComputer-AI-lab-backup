overview:   Distilledfrom DeepSeek-R1 on Qwen-1.5b, this model excels in reasoning, math, coding, and multilingual tasks (especially Chinese). W4A16 quantization and G128 compression cut memory use while retaining accuracy, enabling efficient local/edge deployment and cost-effective AI.
